name: Daily Price Fetch

on:
  schedule:
    - cron: '30 21 * * 1-5'
  workflow_dispatch:

jobs:
  fetch-prices:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run price fetcher
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
        run: python -m ingestion.price_fetcher
      
      - name: Install dbt
        run: pip install dbt-core dbt-postgres

      - name: Create dbt profile
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml << 'EOF'
          finance_platform:
            target: dev
            outputs:
              dev:
                type: postgres
                host: aws-1-us-east-1.pooler.supabase.com
                port: 5432
                user: postgres.uiocdjtwshxpqtlcgfel
                sslmode: require
                password: ${{ secrets.SUPABASE_DB_PASSWORD }}
                dbname: postgres
                schema: public
                threads: 1
          EOF

      - name: Run dbt
        run: dbt run --project-dir dbt/ --profiles-dir ~/.dbt

